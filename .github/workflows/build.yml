name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # This action sets up Gradle and provides a wrapper for you
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Now we generate the wrapper files (they will be created locally)
      - name: Generate Gradle Wrapper
        run: gradle wrapper

      # Now build the APK using the newly created wrapper
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-AI-Assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
